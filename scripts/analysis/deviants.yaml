    "conditions" :  ["timDev"],
    "weights"    : [1],
    "binary"     : True,  # all devs are treated as the same event
    "absolute"   : False, # irrelevant if binary True
    "groups"     : False  # irrelevant if binary True
  }
  when22 : {
    "conditions" : [
      "-125", "-100", "-80", "-63", "-48", "-36", "-27", "-19", "-13", "-8", "-4",
      "4", "8", "13", "19", "27", "36", "48", "63", "80", "100", "125"],
    "weights" : [
      0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455,
      0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455, 0.0455], # 1/22 = 0.045455
      "binary"   : False, # devs are treated differently
      "absolute" : False, # direction matters (early is assumed different from late)
      "groups"   : False  # no assumption about groups (taking values from exp. design)
  }
  when11 : {
